services:
  calabunga:
    image: calabunga:latest
    build: .
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: "${PORT:-8080}"
      JWT_SECRET: "${JWT_SECRET:-changeme}"
      JWT_MAX_TTL: "${JWT_MAX_TTL:-720h}"
      JWT_DEFAULT_TTL: "${JWT_DEFAULT_TTL:-24h}"
    restart: unless-stopped
